# Fly.io configuration. Run `fly launch --no-deploy` once to claim an app name,
# then set the secrets and deploy:
#
#   fly secrets set ANTHROPIC_API_KEY=sk-ant-... HUMANISER_ACCESS_CODE=your-code
#   fly deploy
#
app = "humaniser"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  TRUST_PROXY = "1"
  NODE_ENV = "production"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response]
    pristine = false

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "5s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
